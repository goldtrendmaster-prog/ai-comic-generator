<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Comic Storyboard & Xpro Studio Suite</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #09090b; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(19, 19, 26, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.5rem; }
        .input-modern { width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0.75rem; color: #fff; outline: none; }
        .input-modern:focus { border-color: #a855f7; ring: 2px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header Navigation -->
    <header class="bg-[#13131a] border-b border-white/10 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="text-sm md:text-base font-bold text-white tracking-wide">AI COMIC & XPRO STUDIO SUITE</h1>
                <p class="text-[10px] text-purple-400 font-medium uppercase">Storyboard Generator & Image Creator</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="switchWorkspace('storyboard')" id="nav-btn-storyboard" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold transition shadow">
                <i class="fa-solid fa-book-open mr-1"></i> Storyboard Komik
            </button>
            <button onclick="switchWorkspace('xpro')" id="nav-btn-xpro" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-xs font-semibold transition border border-white/10">
                <i class="fa-solid fa-image mr-1"></i> Xpro Studio AI
            </button>
        </div>
    </header>

    <!-- WORKSPACE 1: STORYBOARD KOMIK -->
    <main id="workspace-storyboard" class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
        <div class="glass-panel p-6 space-y-4">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-pen-nib text-purple-400"></i> Generator Skenario & Prompt Komik Manhua
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Judul Proyek</label>
                    <input type="text" id="sb-title" class="input-modern text-sm" value="Kisah Pendekar Bayangan">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Gaya Visual Komik</label>
                    <select id="sb-style" class="input-modern text-sm bg-gray-900">
                        <option value="Manhua Drama China Realistis Sinematik (Xianxia/Wuxia)">Manhua Drama China (Xianxia/Wuxia)</option>
                        <option value="Webtoon Clean Line Art & Cel Shading">Modern Webtoon Style</option>
                        <option value="Manga Hitam Putih Shonen Speedlines">Manga Shonen Jepang</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Sinopsis / Naskah Cerita</label>
                <textarea id="sb-synopsis" rows="3" class="input-modern text-sm" placeholder="Tuliskan naskah atau sinopsis penuh intrik dan cliffhanger..."></textarea>
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="generateStoryboardScenes()" class="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl text-xs font-bold shadow hover:opacity-90 transition">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> Buat Adegan & Prompt AI
                </button>
            </div>
        </div>

        <div id="sb-scenes-container" class="space-y-4">
            <!-- Dynamic Scenes -->
        </div>
    </main>

    <!-- WORKSPACE 2: XPRO STUDIO AI -->
    <main id="workspace-xpro" class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6 hidden">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-panel p-6 space-y-4">
                    <label class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-align-left text-purple-400"></i> Deskripsi Gambar (Prompt)
                    </label>
                    <div class="relative">
                        <textarea id="xpro-prompt" rows="5" class="input-modern text-sm font-semibold pb-12" placeholder="Gambarkan apa yang ada di pikiran Anda secara detail..."></textarea>
                        <button onclick="enhancePrompt()" class="absolute bottom-3 right-3 text-xs bg-gray-800 hover:bg-purple-600 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg border border-gray-700 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-bolt text-yellow-400"></i> Perkaya Prompt
                        </button>
                    </div>
                </div>

                <button onclick="runXproGenerate()" class="w-full py-4 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 text-white font-bold rounded-2xl shadow-lg hover:opacity-90 transition text-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Mulai Generate AI
                </button>
            </div>

            <div class="lg:col-span-5 space-y-6">
                <div class="glass-panel p-6 space-y-4">
                    <h3 class="text-md font-bold text-white border-b border-white/10 pb-3">Pengaturan Lanjutan</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Rasio Aspek</label>
                            <select id="xpro-aspect" class="input-modern text-xs">
                                <option value="9:16">Potret (9:16)</option>
                                <option value="1:1">Persegi (1:1)</option>
                                <option value="16:9">Lanskap (16:9)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Kualitas</label>
                            <select id="xpro-quality" class="input-modern text-xs">
                                <option value="standard">HD Standar</option>
                                <option value="4k">4K UHD</option>
                                <option value="8k">8K Masterpiece</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function switchWorkspace(mode) {
            const sb = document.getElementById('workspace-storyboard');
            const xp = document.getElementById('workspace-xpro');
            const btnSb = document.getElementById('nav-btn-storyboard');
            const btnXp = document.getElementById('nav-btn-xpro');

            if (mode === 'storyboard') {
                sb.classList.remove('hidden');
                xp.classList.add('hidden');
                btnSb.className = "px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold transition shadow";
                btnXp.className = "px-4 py-2 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-xs font-semibold transition border border-white/10";
            } else {
                xp.classList.remove('hidden');
                sb.classList.add('hidden');
                btnXp.className = "px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold transition shadow";
                btnSb.className = "px-4 py-2 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-xs font-semibold transition border border-white/10";
            }
        }

        function generateStoryboardScenes() {
            const title = document.getElementById('sb-title').value;
            const style = document.getElementById('sb-style').value;
            const container = document.getElementById('sb-scenes-container');
            
            container.innerHTML = `
                <div class="glass-panel p-5 space-y-3">
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <span class="text-xs font-bold text-purple-400">#1 Adegan Utama: ${title}</span>
                        <span class="text-[10px] bg-purple-500/10 text-purple-300 px-2 py-0.5 rounded border border-purple-500/20">Siap Pakai</span>
                    </div>
                    <p class="text-xs text-gray-300">Karakter utama berdiri di puncak tebing dengan tatapan tajam dan penuh perhitungan.</p>
                    <div class="bg-gray-950 p-3 rounded-xl border border-white/10 font-mono text-xs text-purple-300">
                        Prompt: ${style}, Wide Angle, dramatic sunset lighting, speech bubble "Takdir ada di tanganku...", sound effect SWOOSH!, 8k.
                    </div>
                    <div class="bg-pink-950/20 p-3 rounded-xl border border-pink-500/20 text-xs text-pink-200">
                        Narasi Medsos (Max 300 Karakter): Babak baru pertarungan dimulai! Siapa yang akan bertahan? 😱🔥 #Manhua #FYP #Webtoon
                    </div>
                </div>
            `;
        }

        function enhancePrompt() {
            const promptInput = document.getElementById('xpro-prompt');
            promptInput.value = (promptInput.value ? promptInput.value + ", " : "") + "Cinematic lighting, highly detailed, photorealistic masterpiece, 8k resolution, dramatic shadows";
        }

        function runXproGenerate() {
            alert("Proses generate gambar Xpro Studio AI dimulai!");
        }
    </script>
</body>
</html>
